name: result-acceptance
run-name: Result acceptance for PR ${{ github.event.issue.number }} / comment ${{ github.event.comment.id }}

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  start:
    if: ${{ github.event.issue.pull_request && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '.result-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
      checks: read
      statuses: read
    outputs:
      scenario: ${{ steps.select.outputs.scenario }}
      continue: ${{ steps.candidate.outputs.continue }}
      noop: ${{ steps.candidate.outputs.noop }}
      sha: ${{ steps.candidate.outputs.sha }}
      context: ${{ steps.candidate.outputs.context }}
    steps:
      - name: Checkout trusted acceptance helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select fixed acceptance case
        id: select
        run: python3 -I .github/result-acceptance.py select
      - name: Start candidate
        id: candidate
        uses: GrantBirki/branch-deploy@b6d501cae290828120046916873d86d7099e61ce
        with:
          trigger: .result-deploy
          noop_trigger: .result-noop
          admins: GrantBirki
          environment: sandbox
          environment_targets: sandbox
          commit_verification: true
          enable_pr_stacks: true
          skip_completing: ${{ !startsWith(steps.select.outputs.scenario, 'ordinary-') }}
          sticky_locks: ${{ steps.select.outputs.scenario == 'sticky' }}
          update_branch: disabled
      - name: Assert starting outputs
        env:
          SCENARIO: ${{ steps.select.outputs.scenario }}
          ACTION_OUTPUTS: ${{ toJSON(steps.candidate.outputs) }}
        run: python3 -I .github/result-acceptance.py start
      - name: Harmless ordinary work
        if: ${{ startsWith(steps.select.outputs.scenario, 'ordinary-') }}
        env:
          SCENARIO: ${{ steps.select.outputs.scenario }}
        run: |
          echo 'Harmless ordinary deployment or noop work'
          if [ "$SCENARIO" = 'ordinary-failure' ]; then exit 1; fi

  work:
    needs: start
    if: >-
      ${{ needs.start.outputs.continue == 'true' &&
          !startsWith(needs.start.outputs.scenario, 'ordinary-') &&
          needs.start.outputs.scenario != 'skipped' &&
          fromJSON(needs.start.outputs.context).run_attempt == github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.start.outputs.sha }}
          persist-credentials: false
      - name: Assert exact selected commit
        env:
          EXPECTED_SHA: ${{ needs.start.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Produce a real failed job
        if: ${{ needs.start.outputs.scenario == 'failure' || needs.start.outputs.scenario == 'noop-failure' }}
        run: exit 1
      - name: Wait for ordinary workflow cancellation
        if: ${{ needs.start.outputs.scenario == 'cancelled' }}
        run: |
          echo 'RESULT_ACCEPTANCE_WAITING_FOR_CANCELLATION'
          sleep 240
      - name: Harmless deployment or noop work
        run: echo 'RESULT_ACCEPTANCE_WORK_COMPLETED'

  result:
    needs: [start, work]
    if: ${{ always() && needs.start.outputs.continue == 'true' && !startsWith(needs.start.outputs.scenario, 'ordinary-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout trusted acceptance helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Snapshot and prepare controlled inputs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_CONTEXT: ${{ needs.start.outputs.context }}
          JOB_RESULTS: ${{ toJSON(needs.*.result) }}
          SCENARIO: ${{ needs.start.outputs.scenario }}
        run: python3 -I .github/result-acceptance.py before
      - name: Complete candidate
        if: ${{ needs.start.outputs.scenario != 'manual' }}
        id: candidate
        uses: GrantBirki/branch-deploy@b6d501cae290828120046916873d86d7099e61ce
        with:
          result_mode: true
          context: ${{ steps.prepare.outputs.context }}
          job_results: ${{ steps.prepare.outputs.job_results }}
          result_url: ${{ steps.prepare.outputs.result_url }}
      - name: Assert completion and original state
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_OUTPUTS: ${{ toJSON(steps.candidate.outputs) }}
          ACTION_OUTCOME: ${{ steps.candidate.outcome }}
        run: python3 -I .github/result-acceptance.py after

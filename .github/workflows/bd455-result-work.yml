name: Result mode acceptance work

on:
  workflow_call:
    inputs:
      scenario:
        type: string
        required: true
      context:
        type: string
        required: true
      noop:
        type: boolean
        required: true

permissions: {}

jobs:
  work:
    if: ${{ fromJSON(inputs.context).run_attempt == github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Change only the captured disposable lock
        if: ${{ inputs.scenario == 'replacement' || inputs.scenario == 'missing' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETION_CONTEXT: ${{ inputs.context }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process'
          const context = JSON.parse(process.env.COMPLETION_CONTEXT)
          const scenario = process.env.SCENARIO
          const repository = process.env.GITHUB_REPOSITORY
          const allowed = new Set(['grantbirki/actions-sandbox', 'birki-sandbox/actions-sandbox'])
          if (!allowed.has(repository.toLowerCase()) ||
              context.repository.toLowerCase() !== repository.toLowerCase() ||
              !['replacement', 'missing'].includes(scenario) ||
              context.environment !== `bd455-${scenario}` ||
              context.run_id !== Number(process.env.GITHUB_RUN_ID) ||
              context.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
              !/^[0-9a-f]{40}$/.test(context.lock_ref_sha)) {
            throw new Error('Refusing a lock fixture outside this admitted disposable run')
          }
          const api = (method, route, body) => {
            const args = ['api', '--method', method, route]
            if (body !== undefined) args.push('--input', '-')
            const response = spawnSync('gh', args, {
              encoding: 'utf8',
              ...(body === undefined ? {} : {input: JSON.stringify(body)})
            })
            if (response.status !== 0) throw new Error(`Fixture API failed: ${method} ${route}`)
            const parsed = JSON.parse(response.stdout)
            if (parsed.errors?.length) throw new Error('Fixture GraphQL request failed')
            return parsed
          }
          const branch = `${context.environment}-branch-deploy-lock`
          const before = context.lock_ref_sha
          const ref = api('GET', `repos/${repository}/git/ref/heads/${branch}`)
          if (ref.object.sha !== before) throw new Error('Fixture lock already changed; leaving it alone')
          const repo = api('GET', `repos/${repository}`)
          let after = '0000000000000000000000000000000000000000'
          if (scenario === 'replacement') {
            const commit = api('GET', `repos/${repository}/git/commits/${before}`)
            after = api('POST', `repos/${repository}/git/commits`, {
              message: 'Replace a disposable result mode acceptance lock ref',
              tree: commit.tree.sha,
              parents: [before]
            }).sha
          }
          api('POST', 'graphql', {
            query: 'mutation($repository: ID!, $name: GitRefname!, $before: GitObjectID!, $after: GitObjectID!) { updateRefs(input: {repositoryId: $repository, refUpdates: [{name: $name, beforeOid: $before, afterOid: $after}]}) { clientMutationId } }',
            variables: {repository: repo.node_id, name: `refs/heads/${branch}`, before, after}
          })
          console.log(JSON.stringify({scenario, branch, before, after}))
          NODE

      - name: Wait up to five minutes for a real disposable PR head update
        if: ${{ inputs.scenario == 'head-moved' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETION_CONTEXT: ${{ inputs.context }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process'
          import {setTimeout} from 'node:timers/promises'
          const context = JSON.parse(process.env.COMPLETION_CONTEXT)
          const repository = process.env.GITHUB_REPOSITORY
          const allowed = new Set(['grantbirki/actions-sandbox', 'birki-sandbox/actions-sandbox'])
          if (!allowed.has(repository.toLowerCase()) ||
              context.repository.toLowerCase() !== repository.toLowerCase() ||
              context.environment !== 'bd455-head-moved' || context.noop !== false ||
              context.run_id !== Number(process.env.GITHUB_RUN_ID) ||
              context.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
              !Number.isSafeInteger(context.issue_number) || context.issue_number < 1 ||
              !/^[0-9a-f]{40}$/.test(context.sha)) {
            throw new Error('Refusing a head-movement read outside this admitted disposable run')
          }
          console.log('WAITING_FOR_PR_HEAD_MOVEMENT')
          console.log(JSON.stringify({repository, issue: context.issue_number, admitted_sha: context.sha}))
          const deadline = Date.now() + 300000
          while (Date.now() < deadline) {
            const response = spawnSync('gh', [
              'api', '--method', 'GET', `repos/${repository}/pulls/${context.issue_number}`
            ], {encoding: 'utf8', timeout: 20000})
            if (response.status !== 0) throw new Error('PR head read failed')
            const pull = JSON.parse(response.stdout)
            if (pull.number !== context.issue_number || pull.state !== 'open' ||
                pull.base.repo.full_name.toLowerCase() !== repository.toLowerCase() ||
                !/^[0-9a-f]{40}$/.test(pull.head.sha)) {
              throw new Error('PR head response did not match the disposable target')
            }
            if (pull.head.sha !== context.sha) {
              console.log(JSON.stringify({event: 'OBSERVED_PR_HEAD_MOVEMENT', admitted_sha: context.sha, observed_head_sha: pull.head.sha}))
              process.exit(0)
            }
            await setTimeout(5000)
          }
          throw new Error('No real PR head update observed within five minutes')
          NODE

      - name: Produce a real failed job
        if: ${{ inputs.scenario == 'failure' || inputs.scenario == 'noop-failure' }}
        run: exit 1

      - name: Wait for an operator to cancel the real run
        if: ${{ inputs.scenario == 'cancelled' }}
        run: |
          node --input-type=module <<'NODE'
          console.log('WAITING_FOR_OPERATOR_CANCELLATION')
          setInterval(() => {}, 1000)
          NODE

      - name: Harmless noop work
        if: ${{ inputs.noop }}
        run: echo 'NOOP_VALIDATION_ONLY; no provider or deployment write in this step'

      - name: Harmless deployment work
        if: ${{ !inputs.noop }}
        run: echo 'HARMLESS_DEPLOYMENT_WORK; no external provider is called'

name: Preview check compatibility
run-name: Check compatibility / ${{ github.event.comment.id || inputs.sample }} / ${{ github.run_id }}

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      sample:
        description: Prepare check results only on the disposable commit
        required: true
        type: choice
        options: [small, large, observed, ready]

permissions: {}
cache-mode: none

jobs:
  preview-check:
    if: >-
      github.event_name == 'issue_comment' && github.repository == 'GrantBirki/actions-sandbox' &&
      github.event.issue.pull_request && github.run_attempt == 1 &&
      github.event.comment.user.login == 'GrantBirki' && github.event.comment.author_association == 'OWNER' &&
      contains(fromJSON('[283,284,285]'), github.event.issue.number) &&
      startsWith(github.event.comment.body, '.sample-checks | ')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
      deployments: read
      checks: read
      statuses: read
    steps:
      - name: Request a preview
        id: sample
        uses: GrantBirki/branch-deploy@7e3067ed6c2e3d93a71841db90a5c319423219e9
        continue-on-error: true
        with:
          noop_trigger: .sample-checks
          stable_branch: ${{ github.event.issue.number == 285 && 'main' || 'bd-preview-checks-124-base' }}
          environment: review-checks
          environment_targets: review-checks
          update_branch: disabled
          commit_verification: true
          checks: ${{ github.event.issue.number == 284 && 'sample-required' || github.event.issue.number == 285 && 'required' || 'all' }}
          deployment_confirmation: ${{ contains(github.event.comment.body, 'confirm') }}
          deployment_confirmation_timeout: 480

      - name: Verify the decision
        if: always()
        shell: python
        env:
          COMMAND: ${{ github.event.comment.body }}
          OUTPUTS: ${{ toJSON(steps.sample.outputs) }}
          OUTCOME: ${{ steps.sample.outcome }}
        run: |
          import json, os
          env = os.environ
          command, result = env["COMMAND"], json.loads(env["OUTPUTS"])
          keys = "decision reason_code continue noop commit_status sha base_ref deployment_id".split()
          got = {key: result.get(key, "") for key in keys}
          print("PREVIEW_CHECK_RESULT", json.dumps(got, sort_keys=True))
          if "stop" in command:
              assert got["reason_code"] == "prechecks_failed", got
              assert got["continue"] != "true" and got["commit_status"] == "UNAVAILABLE", got
          else:
              ci = "" if "no ci" in command else "SUCCESS"
              assert env["OUTCOME"] == "success", env["OUTCOME"]
              assert (got["reason_code"], got["continue"], got["noop"], got["commit_status"]) == ("noop_ready", "true", "true", ci), got
          assert not got["deployment_id"], got

  prepare-checks:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'GrantBirki/actions-sandbox' &&
      github.actor == 'GrantBirki' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Prepare check results on the disposable commit
        env:
          SAMPLE: ${{ inputs.sample }}
          GH_TOKEN: ${{ github.token }}
          FIXTURE: 1601aa067ab5de46b051fbd987ef621d0b8594af
        shell: python
        run: |
          import json, os, subprocess, time
          env = os.environ
          repo = "repos/" + env["GITHUB_REPOSITORY"]
          ref = env["FIXTURE"]

          def api(path, fields=None, method="GET"):
              args = ["gh", "api", "-X", method, repo + "/" + path]
              data = None
              if fields is not None:
                  args += ["--input", "-"]
                  data = json.dumps(fields)
              return json.loads(subprocess.check_output(args, text=True, input=data))

          pr = api("pulls/284")
          assert pr["head"]["sha"] == ref and pr["head"]["ref"] == "bd-preview-checks-124-pages" and pr["base"]["ref"] == "bd-preview-checks-124-base"
          sample = env["SAMPLE"]

          def add(name, result):
              data = api("check-runs", dict(name=name, head_sha=ref, status="completed", conclusion=result), method="POST")
              assert data["head_sha"] == ref and data["conclusion"] == result and data["name"] == name
              time.sleep(1.45)

          if sample == "small":
              assert api(f"commits/{ref}/check-runs")["total_count"] == 0
              add("sample-required", "success")
              add("sample-observation", "failure")
          else:
              path = f"commits/{ref}/check-runs?check_name=sample-observation"
              rows = api(path)["check_runs"]
              assert len(rows) == 1 and rows[0]["head_sha"] == ref
              run_id = rows[0]["id"]
              result = "failure" if sample == "observed" else "success"
              data = api(f"check-runs/{run_id}", dict(status="completed", conclusion=result), method="PATCH")
              assert data["head_sha"] == ref and data["conclusion"] == result
              if sample == "large":
                  assert api(f"commits/{ref}/check-runs")["total_count"] == 2
                  for number in range(3, 102):
                      add(f"preview-sample-{number:03}", ("success", "neutral", "skipped")[number % 3])
          n = api(f"commits/{ref}/check-runs")["total_count"]
          assert n == (2 if sample == "small" else 101), n
          print("Prepared", n, "fixture results.")

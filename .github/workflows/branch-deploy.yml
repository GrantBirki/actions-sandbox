name: branch-deploy

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  deployments: write
  contents: write
  checks: read
  statuses: read

jobs:
  branch-deploy:
    if: ${{ github.event.issue.pull_request && contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) }} # only run on pull request comments
    runs-on: ubuntu-latest

    steps:
      - uses: grantbirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # pin@v12.1.0
        id: branch-deploy
        with:
          sticky_locks: true
          trigger: ".deploy"
          production_environments: production
          environment_targets: "production,stage,dev"
          commit_verification: true
          stable_branch: 'main'
          environment: "production"
          admins: "GrantBirki"
          #deployment_confirmation: true
          #deployment_confirmation_timeout: 20
          #checks: 'quality_gate'
          #allow_sha_deployments: true
          #checks: 'required'
          #ignored_checks: 'test1,test3'

      - name: validate deployment revision
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        env:
          DEPLOY_SHA: ${{ steps.branch-deploy.outputs.sha }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

      # Checkout your projects repository based on the ref provided by the branch-deploy step
      - uses: actions/checkout@v6
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        with:
          ref: ${{ steps.branch-deploy.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: verify deployment checkout
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        env:
          DEPLOY_SHA: ${{ steps.branch-deploy.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          for file in README.md noop; do
            [[ -f "$file" && ! -L "$file" ]] || exit 1
          done

      - name: view parsed json params (if present)
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        env:
          PARSED_PARAMS: ${{ steps.branch-deploy.outputs.parsed_params }}
        run: |
          printf 'parsed_params: %s\n' "$PARSED_PARAMS"
          # if parsed_params is not empty, parse it as json and print it nicely
          if [ -n "$PARSED_PARAMS" ]; then
            echo "parsed_params is not empty, parsing as json:"
            printf '%s\n' "$PARSED_PARAMS" | jq .
          else
            echo "parsed_params is empty"
          fi

      # Do some fake "noop" deployment logic here
      # conditionally run a noop deployment
      - name: fake noop deploy
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop == 'true' }}
        env:
          DEPLOY_SHA: ${{ steps.branch-deploy.outputs.sha }}
          DEPLOY_REF: ${{ steps.branch-deploy.outputs.ref }}
        run: |
          echo "I am doing a fake noop deploy"
          printf 'noop -> sha: %s ref: %s\n' "$DEPLOY_SHA" "$DEPLOY_REF"
          echo "Current branch: $(git branch --show-current)"
          echo "Current commit SHA: $(git rev-parse HEAD)"
          echo "===================="
          echo "contents of the README.md:"
          cat README.md
          echo "===================="
          echo "contents of the noop file:"
          cat noop

      # Do some fake "regular" deployment logic here
      # conditionally run a regular deployment
      - name: fake regular deploy
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop != 'true' }}
        env:
          DEPLOY_SHA: ${{ steps.branch-deploy.outputs.sha }}
          DEPLOY_REF: ${{ steps.branch-deploy.outputs.ref }}
          PARAMS: ${{ steps.branch-deploy.outputs.params }}
          PARSED_PARAMS: ${{ steps.branch-deploy.outputs.parsed_params }}
        run: |
          echo "I am doing a fake regular deploy"
          printf 'params: %s\n' "$PARAMS"
          printf 'parsed_params: %s\n' "$PARSED_PARAMS"
          echo "===================="
          printf 'deployed -> sha: %s ref: %s\n' "$DEPLOY_SHA" "$DEPLOY_REF"
          echo "Current branch: $(git branch --show-current)"
          echo "Current commit SHA: $(git rev-parse HEAD)"
          echo "===================="
          echo "contents of the README.md:"
          cat README.md
          echo "===================="
          echo "contents of the noop file:"
          cat noop

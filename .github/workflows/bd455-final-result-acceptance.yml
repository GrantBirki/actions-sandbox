          BD455_FINAL_DEPLOYMENT_RESULT: ${{ steps.complete.outputs.deployment_result }}
          BD455_FINAL_DECISION: ${{ steps.complete.outputs.decision }}
          BD455_FINAL_REASON_CODE: ${{ steps.complete.outputs.reason_code }}
        run: |
          node --input-type=module <<'NODE'
          const scenario = process.env.BD455_FINAL_SCENARIO
          const inputErrors = new Set(['malformed-results', 'missing-results', 'unsafe-url'])
          const expected = inputErrors.has(scenario) ? 'invalid_result_inputs' : 'invalid_result_context'
          if (process.env.BD455_FINAL_OUTCOME !== 'failure' || process.env.BD455_FINAL_DEPLOYMENT_RESULT !== '' || process.env.BD455_FINAL_DECISION !== 'failure' || process.env.BD455_FINAL_REASON_CODE !== expected) {
            throw new Error('Result mode did not reject the fixed invalid input as expected')
          }
          NODE


  reusable-result:

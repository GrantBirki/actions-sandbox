name: test1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test1:
    name: test1
    runs-on: ubuntu-latest

    steps:
      - name: Check out the acceptance commit
        if: ${{ startsWith(github.head_ref || github.ref_name, 'pr51-') }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check the acceptance failure marker
        if: ${{ startsWith(github.head_ref || github.ref_name, 'pr51-') }}
        run: test ! -e .pr51/fail-test1
      - name: it will pass
        run: echo "success"

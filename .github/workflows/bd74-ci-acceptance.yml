name: BD74 exact SHA CI acceptance
on:
  issue_comment:
    types: [created]
permissions:
  pull-requests: write
  deployments: write
  contents: write
  checks: read
  statuses: read
cache-mode: none
jobs:
  verify:
    if: ${{ github.event.issue.pull_request && contains(fromJSON('[249,250]'), github.event.issue.number) && github.event.comment.user.login == 'GrantBirki' && (github.event.comment.body == '.bd74-ci' || github.event.comment.body == '.bd74-noop') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [all, required]
    steps:
      - uses: GrantBirki/branch-deploy@6e162299ab3b8f054ce1880e2d9855bf0e891668
        id: deploy
        continue-on-error: true
        with:
          trigger: .bd74-ci
          noop_trigger: .bd74-noop
          stable_branch: ${{ github.event.issue.number == 250 && 'bd74-6e16-policy' || 'bd74-6e16-clear' }}
          update_branch: disabled
          checks: ${{ matrix.checks }}
          environment: bd74-6e16-audit
          environment_targets: bd74-6e16-audit
          production_environments: bd74-6e16-audit
          disable_lock: true
      - name: Record real admission
        if: always()
        env:
          ADMITTED: ${{ steps.deploy.outputs.continue }}
          CI_STATUS: ${{ steps.deploy.outputs.commit_status }}
          SELECTED_SHA: ${{ steps.deploy.outputs.sha }}
          STEP_OUTCOME: ${{ steps.deploy.outcome }}
          IS_NOOP: ${{ steps.deploy.outputs.noop }}
        run: |
          printf 'BD74_ADMISSION continue=%s ci=%s sha=%s outcome=%s noop=%s\n' "$ADMITTED" "$CI_STATUS" "$SELECTED_SHA" "$STEP_OUTCOME" "$IS_NOOP"

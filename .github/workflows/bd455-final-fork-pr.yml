name: Result mode fork PR fixture
run-name: Create the fixed result mode fork PR

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: bd455-final-fork-pr-920f085
  cancel-in-progress: false

jobs:
  create:
    if: >-
      ${{ github.repository == 'GrantBirki/actions-sandbox' &&
          github.actor == 'GrantBirki' && github.triggering_actor == 'GrantBirki' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create only the fixed disposable cross-repository PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process'
          if (process.env.GITHUB_REPOSITORY !== 'GrantBirki/actions-sandbox' ||
              process.env.GITHUB_ACTOR !== 'GrantBirki' ||
              process.env.GITHUB_TRIGGERING_ACTOR !== 'GrantBirki' ||
              process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch' ||
              process.env.GITHUB_REF !== 'refs/heads/main') {
            throw new Error('Refusing a fork PR outside the fixed parent dispatch')
          }
          const api = (method, route, body) => {
            const response = spawnSync('gh', [
              'api', '--method', method, route,
              ...(body === undefined ? [] : ['--input', '-'])
            ], {
              encoding: 'utf8', timeout: 30000,
              ...(body === undefined ? {} : {input: JSON.stringify(body)})
            })
            if (response.status !== 0) {
              let details = {}
              try { details = JSON.parse(response.stdout) } catch {}
              const safe = {
                method,
                status: /HTTP (\d{3})/.exec(response.stderr)?.[1],
                message: String(details.message ?? '').slice(0, 512),
                errors: Array.isArray(details.errors) ? details.errors.slice(0, 5).map(error => ({
                  resource: error.resource, field: error.field, code: error.code,
                  message: String(error.message ?? '').slice(0, 512)
                })) : []
              }
              throw new Error('Fork PR API request failed: ' + JSON.stringify(safe))
            }
            return JSON.parse(response.stdout)
          }
          const existing = api('GET', 'repos/GrantBirki/actions-sandbox/pulls?state=open&base=main&head=birki-sandbox%3Abd455-final-live-cross-920f085&per_page=100')
          if (!Array.isArray(existing) || existing.length !== 0) {
            throw new Error('An open fixture PR may already exist; inspect it instead of creating another')
          }
          const pull = api('POST', 'repos/GrantBirki/actions-sandbox/pulls', {
            title: 'Test result mode fork completion',
            body: 'This pull request exercises result-mode completion with harmless sandbox work.',
            base: 'main', head: 'birki-sandbox:bd455-final-live-cross-920f085',
            head_repo: 'actions-sandbox', draft: false, maintainer_can_modify: false
          })
          if (pull.base.repo.full_name !== 'GrantBirki/actions-sandbox' || pull.base.ref !== 'main' ||
              pull.head.repo.full_name !== 'birki-sandbox/actions-sandbox' || pull.head.ref !== 'bd455-final-live-cross-920f085' ||
              pull.user.login !== 'github-actions[bot]' || pull.state !== 'open' || pull.draft !== false) {
            throw new Error('Created PR did not match the expected fixture; inspect it before proceeding')
          }
          console.log('BD455_FINAL_FORK_PR ' + JSON.stringify({number: pull.number, url: pull.html_url, author: pull.user.login, head_sha: pull.head.sha}))
          NODE

name: Branch Deploy v12.3.0 live acceptance
run-name: >-
  Release 123 / ${{ github.event_name }} / ${{ github.event.issue.number || github.event.pull_request.number || github.ref_name }} / ${{ github.event.comment.id || github.sha }}
on:
  issue_comment:
    types: [created]
  push:
    branches: [release-123-base]
  pull_request:
    branches: [release-123-base]
    types: [closed]

permissions: {}
cache-mode: none

jobs:
  exercise:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      contains(fromJSON('[251,252]'), github.event.issue.number) &&
      github.event.comment.user.login == 'GrantBirki' && github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '.r123-')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pull-requests: write
      deployments: write
      contents: write
      checks: read
      statuses: read
    outputs:
      report_context: ${{ steps.action.outputs.context }}
      do_report: ${{ steps.fixture.outputs.case == 'report' && steps.action.outputs.continue == 'true' }}
    steps:
      - name: Select an isolated fixture (never execute PR code)
        id: fixture
        env:
          BODY: ${{ github.event.comment.body }}
        shell: python
        run: |
          import os, re
          candidates = re.findall(r'release-123-([a-z]+)', os.environ['BODY'])
          case = candidates[-1] if candidates else 'plain'
          if case not in 'plain sticky timeout head basechange yes replace policy required custom report failed merge stable draft stackopt'.split():
              case = 'plain'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('case=' + case, file=f)
              print('env=release-123-' + case, file=f)
              print('confirm=' + str(case in ['sticky', 'timeout', 'head', 'basechange', 'yes', 'replace']).lower(), file=f)
      - name: Exercise the released action
        id: action
        uses: GrantBirki/branch-deploy@18049b1a468b9a0220663f56017d2ba309d08e6b # v12.3.0
        continue-on-error: true
        with:
          stable_branch: ${{ github.event.issue.number == 252 && 'main' || 'release-123-base' }}
          update_branch: disabled
          commit_verification: true
          environment: ${{ steps.fixture.outputs.env }}
          environment_targets: ${{ steps.fixture.outputs.env }}
          production_environments: ${{ steps.fixture.outputs.env }}
          trigger: .r123-deploy
          noop_trigger: .r123-noop
          help_trigger: .r123-help
          lock_trigger: .r123-lock
          unlock_trigger: .r123-unlock
          lock_info_alias: .r123-wcid
          checks: ${{ steps.fixture.outputs.case == 'custom' && 'release-123-custom-ci' || github.event.issue.number == 252 && 'required' || 'all' }}
          skip_reviews: ${{ steps.fixture.outputs.case == 'policy' && steps.fixture.outputs.env || '' }}
          enable_pr_stacks: ${{ steps.fixture.outputs.case == 'stackopt' }}
          deployment_confirmation: ${{ steps.fixture.outputs.confirm }}
          deployment_confirmation_timeout: ${{ steps.fixture.outputs.case == 'timeout' && '12' || '300' }}
          sticky_locks: ${{ steps.fixture.outputs.case == 'merge' }}
          skip_completing: ${{ steps.fixture.outputs.case == 'report' }}
      - name: Record actual outputs (an expected refusal may show a red action step)
        if: always()
        shell: python
        env:
          OUTPUTS: ${{ toJSON(steps.action.outputs) }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          import json, os
          outputs = json.loads(os.environ['OUTPUTS'])
          keys = 'reason_code decision continue noop sha ref base_ref deployment_id commit_status review_decision commit_verified parsed_params'.split()
          data = {k: outputs.get(k, '') for k in keys}
          data.update(outcome=os.environ['OUTCOME'], attempt=os.environ['GITHUB_RUN_ATTEMPT'])
          print('RELEASE123_EVIDENCE ' + json.dumps(data))
      - name: Verify the selected SHA without checking out or executing it
        if: steps.action.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED: ${{ steps.action.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.action.outputs.deployment_id }}
          NOOP: ${{ steps.action.outputs.noop }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SELECTED" --jq .sha)" = "$SELECTED"
          if [[ "$NOOP" = false ]]; then
            [[ "$DEPLOYMENT_ID" =~ ^[0-9]+$ ]]
            test "$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID" --jq .sha)" = "$SELECTED"
          else
            test "$NOOP" = true
            test -z "$DEPLOYMENT_ID"
          fi
      - name: Harmless noop marker
        if: steps.action.outputs.continue == 'true' && steps.action.outputs.noop == 'true'
        run: echo RELEASE123_NOOP_ONLY
      - name: Harmless deployment marker
        if: steps.action.outputs.continue == 'true' && steps.action.outputs.noop == 'false'
        run: echo RELEASE123_WOULD_DEPLOY
      - name: Deliberately fail the simulated deployment
        if: steps.fixture.outputs.case == 'failed' && steps.action.outputs.continue == 'true'
        run: exit 1

  report:
    needs: exercise
    if: always() && needs.exercise.outputs.do_report == 'true' && github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      deployments: write
      contents: write
    steps:
      - name: Complete the deployment in a different job
        uses: GrantBirki/branch-deploy@18049b1a468b9a0220663f56017d2ba309d08e6b # v12.3.0
        id: result
        with:
          result_mode: true
          context: ${{ needs.exercise.outputs.report_context }}
          job_results: ${{ toJSON(needs.*.result) }}
          result_url: https://example.com/release-acceptance
      - name: Assert the final result
        if: always()
        env:
          RESULT: ${{ steps.result.outputs.deployment_result }}
        run: test "$RESULT" = success

  merge-check:
    if: github.event_name == 'push' && github.ref_name == 'release-123-base'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      pull-requests: read
    steps:
      - name: Check whether the merged tree was already deployed
        id: action
        uses: GrantBirki/branch-deploy@18049b1a468b9a0220663f56017d2ba309d08e6b # v12.3.0
        with:
          merge_deploy_mode: true
          environment: release-123-merge
          stable_branch: release-123-base
      - name: Record the merge decision
        env:
          REASON: ${{ steps.action.outputs.reason_code }}
          CONTINUE: ${{ steps.action.outputs.continue }}
          NOOP: ${{ steps.action.outputs.noop }}
        run: echo "RELEASE123_MERGE reason=$REASON continue=$CONTINUE noop=$NOOP"

  unlock-merged:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.number == 251 &&
      github.event.pull_request.merged && github.event.pull_request.base.ref == 'release-123-base'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: read
    steps:
      - name: Release only the merged fixture's lock
        id: action
        uses: GrantBirki/branch-deploy@18049b1a468b9a0220663f56017d2ba309d08e6b # v12.3.0
        with:
          unlock_on_merge_mode: true
          environment_targets: release-123-merge
      - name: Verify the fixture lock was released
        env:
          UNLOCKED: ${{ steps.action.outputs.unlocked_environments }}
        run: test "$UNLOCKED" = release-123-merge

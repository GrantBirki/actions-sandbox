name: Released Branch Deploy acceptance
run-name: Release v12.4.2 / ${{ github.event.comment.id }} / ${{ github.run_id }}

on:
  issue_comment:
    types: [created]

permissions: {}
cache-mode: none

concurrency:
  group: release-acceptance-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      github.repository == 'GrantBirki/actions-sandbox' &&
      github.actor == 'GrantBirki' &&
      github.event.comment.user.login == 'GrantBirki' &&
      github.event.comment.author_association == 'OWNER' &&
      github.run_attempt == '1' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 302 &&
      contains(fromJSON('[".release-accept-noop main",".release-accept-deploy main"]'), github.event.comment.body)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      deployments: write
      pull-requests: write
      checks: read
      statuses: read

    steps:
      - name: Verify the frozen test context
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = 'GrantBirki/actions-sandbox'
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as source:
              event = json.load(source)
          assert event['repository']['full_name'] == repo
          assert event['issue']['number'] == 302
          assert event['comment']['user']['login'] == 'GrantBirki'
          assert event['comment']['author_association'] == 'OWNER'
          assert event['comment']['body'] in ('.release-accept-noop main', '.release-accept-deploy main')
          def request(path):
              query = urllib.request.Request('https://api.github.com' + path, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(query, timeout=30) as response:
                  return json.load(response)
          pull = request(f'/repos/{repo}/pulls/302')
          assert pull['state'] == 'open' and pull['draft'] is False
          assert pull['head']['repo']['full_name'] == repo
          assert pull['head']['ref'] == 'branch-deploy-v12.4.2'
          assert pull['head']['sha'] == '44119ae8660ce74ffd9cf5273eb8eca2a4116b4d'
          assert pull['base']['ref'] == 'main'
          assert request(f'/repos/{repo}/branches/main')['commit']['sha'] == os.environ['WORKFLOW_SHA']
          print('RELEASE_ACCEPTANCE_CONTEXT ' + json.dumps({
              'action_sha': '7173dcbb72a30da0148076fade87260ddd1b5e28',
              'workflow_sha': os.environ['WORKFLOW_SHA'],
              'pull_request_sha': pull['head']['sha'],
              'comment_id': event['comment']['id'],
          }, sort_keys=True))
          PY

      - name: Run released Branch Deploy v12.4.2
        id: released
        uses: grantbirki/branch-deploy@7173dcbb72a30da0148076fade87260ddd1b5e28 # pin@v12.4.2
        with:
          trigger: .release-accept-deploy
          noop_trigger: .release-accept-noop
          lock_trigger: .release-accept-lock
          unlock_trigger: .release-accept-unlock
          help_trigger: .release-accept-help
          lock_info_alias: .release-accept-info
          environment: release-v12-4-2
          environment_targets: release-v12-4-2
          production_environments: ''
          skip_ci: release-v12-4-2
          skip_reviews: release-v12-4-2
          commit_verification: 'true'
          stable_branch: main
          update_branch: warn
          deploy_message_path: ''
          sticky_locks: 'false'
          sticky_locks_for_noop: 'false'

      - name: Assert the released action outputs
        env:
          ACTION_OUTPUTS: ${{ toJSON(steps.released.outputs) }}
          EXPECTED_SHA: ${{ github.sha }}
          IS_NOOP: ${{ github.event.comment.body == '.release-accept-noop main' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          outputs = json.loads(os.environ['ACTION_OUTPUTS'])
          noop = os.environ['IS_NOOP'] == 'true'
          assert outputs['continue'] == 'true', outputs
          assert outputs['decision'] == 'continue', outputs
          assert outputs['reason_code'] == ('noop_ready' if noop else 'deployment_ready'), outputs
          assert outputs['sha'] == os.environ['EXPECTED_SHA'], outputs
          assert outputs['ref'] == 'main', outputs
          assert outputs['environment'] == 'release-v12-4-2', outputs
          assert outputs['noop'] == str(noop).lower(), outputs
          assert (outputs.get('deployment_id', '') == '') if noop else outputs['deployment_id'].isdigit(), outputs
          print('RELEASE_ACCEPTANCE_OUTPUTS ' + json.dumps(outputs, sort_keys=True))
          PY

      - name: Check out the selected immutable commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # pin@v7.0.0
        with:
          ref: ${{ steps.released.outputs.sha }}
          persist-credentials: false

      - name: Run the harmless consumer
        env:
          SELECTED_SHA: ${{ steps.released.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SELECTED_SHA"
          test -f README.md
          printf 'RELEASE_ACCEPTANCE_CHECKOUT %s\n' "$SELECTED_SHA"

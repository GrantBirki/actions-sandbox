name: pr51-fork-ci
run-name: pr51-fork ${{ github.event_name }} ${{ github.event.pull_request.number || inputs.fixture }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [pr51-fork-trunk, pr51-fork-join-a]
  workflow_dispatch:
    inputs:
      fixture:
        description: Open one reviewed disposable fixture PR
        type: choice
        required: true
        options: [same, cross, join-a, join-b]
      base_sha:
        description: Exact reviewed base commit
        type: string
        required: true
      head_sha:
        description: Exact reviewed signed marker commit
        type: string
        required: true

permissions: {}

env:
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  WORKFLOW_REF: ${{ github.workflow_ref }}

jobs:
  pr51-fork-ci:
    if: ${{ github.event_name == 'pull_request' && (github.repository == 'GrantBirki/actions-sandbox' || github.repository == 'birki-sandbox/actions-sandbox') && github.event.pull_request.head.repo.full_name == 'birki-sandbox/actions-sandbox' && startsWith(github.event.pull_request.head.ref, 'pr51-fork-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check the signed marker commit without executing PR code
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          base_repo, fork_repo = 'GrantBirki/actions-sandbox', 'birki-sandbox/actions-sandbox'
          identities = {base_repo: 541028848, fork_repo: 1344307397}
          repo, head_sha = os.environ['GITHUB_REPOSITORY'], os.environ['EVENT_HEAD_SHA']
          number = int(os.environ['PR_NUMBER'])
          assert repo in identities and number > 0 and re.fullmatch(r'[0-9a-f]{40}', head_sha)

          def api(repository, path):
              assert repository in identities
              result = subprocess.run(['gh', 'api', '--method', 'GET', f'repos/{repository}/{path}',
                  '-H', 'X-GitHub-Api-Version: 2022-11-28'], capture_output=True, text=True, timeout=30)
              if result.returncode:
                  raise RuntimeError('Fixture metadata could not be read')
              assert len(result.stdout) < 2_000_000
              return json.loads(result.stdout)

          repository, fork = api(repo, ''), api(fork_repo, '')
          assert repository['id'] == identities[repo] and repository['full_name'] == repo and repository['private'] is False
          assert fork['id'] == identities[fork_repo] and fork['full_name'] == fork_repo and fork['fork'] is True and fork['private'] is False
          assert all(fork[key]['id'] == identities[base_repo] and fork[key]['full_name'] == base_repo for key in ('parent', 'source'))
          pull = api(repo, f'pulls/{number}')
          head, base = pull['head'], pull['base']
          assert pull['number'] == number and pull['state'] == 'open' and pull['merged'] is False and pull['draft'] is False
          assert pull['user']['login'] == 'github-actions[bot]' and pull['user']['id'] == 41898282
          assert head['repo']['id'] == identities[fork_repo] and head['repo']['full_name'] == fork_repo and head['repo']['fork'] is True
          assert base['repo']['id'] == identities[repo] and base['repo']['full_name'] == repo and head['sha'] == head_sha
          allowed = {'pr51-fork-cross': 'pr51-fork-trunk'} if repo == base_repo else {
              'pr51-fork-same': 'pr51-fork-trunk', 'pr51-fork-join-a': 'pr51-fork-trunk', 'pr51-fork-join-b': 'pr51-fork-join-a'}
          assert head['ref'] in allowed and base['ref'] == allowed[head['ref']]
          commit = api(fork_repo, f'commits/{head_sha}')
          assert commit['sha'] == head_sha and commit['commit']['verification']['verified'] is True
          files = api(repo, f'pulls/{number}/files?per_page=100')
          assert isinstance(files, list) and 1 <= len(files) == pull['changed_files'] <= 8
          assert all(file['status'] in ('added', 'modified') and not file.get('previous_filename') and
              re.fullmatch(r'[.]pr51-fork/[a-z-]+[.]txt', file['filename']) for file in files)
          tree_sha = commit['commit']['tree']['sha']
          tree = api(fork_repo, f'git/trees/{tree_sha}?recursive=1')
          assert tree['sha'] == tree_sha and tree['truncated'] is False
          assert all(any(item['path'] == file['filename'] and item['sha'] == file['sha'] and
              item['type'] == 'blob' and item['mode'] == '100644' for item in tree['tree']) for file in files)
          current = api(repo, f'pulls/{number}')
          assert current['head']['sha'] == head_sha and current['base']['sha'] == base['sha']
          receipt = {'repository': repo, 'repository_id': identities[repo], 'pull': number,
              'head_repository': fork_repo, 'head_repository_id': identities[fork_repo],
              'base_ref': base['ref'], 'base_sha': base['sha'], 'head_ref': head['ref'], 'head_sha': head_sha,
              'commit_verified': True, 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'], 'workflow_sha': os.environ['WORKFLOW_SHA'],
              'workflow_ref': os.environ['WORKFLOW_REF'],
              'marker_files': [{key: file[key] for key in ('filename', 'status', 'sha')} for file in files]}
          assert receipt['event'] == 'pull_request'
          Path('ci.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Preserve genuine PR CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr51-fork-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci.json
          if-no-files-found: error
          retention-days: 7

  open-fixture:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.repository == 'GrantBirki/actions-sandbox' || github.repository == 'birki-sandbox/actions-sandbox') && github.actor == 'GrantBirki' && github.triggering_actor == 'GrantBirki' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: pr51-fork-setup-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      FIXTURE: ${{ inputs.fixture }}
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Open only the reviewed marker-only fixture PR
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from urllib.parse import urlencode

          base_repo, fork_repo = 'GrantBirki/actions-sandbox', 'birki-sandbox/actions-sandbox'
          identities = {base_repo: 541028848, fork_repo: 1344307397}
          fixtures = {
              'same': (fork_repo, 'pr51-fork-same', 'pr51-fork-trunk'),
              'cross': (base_repo, 'pr51-fork-cross', 'pr51-fork-trunk'),
              'join-a': (fork_repo, 'pr51-fork-join-a', 'pr51-fork-trunk'),
              'join-b': (fork_repo, 'pr51-fork-join-b', 'pr51-fork-join-a'),
          }
          kind = os.environ['FIXTURE']
          assert kind in fixtures
          repo, head, base = fixtures[kind]
          assert repo == os.environ['GITHUB_REPOSITORY']
          assert os.environ['WORKFLOW_REF'] == repo + '/.github/workflows/pr51-fork-ci.yml@refs/heads/main'
          base_sha, head_sha = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          assert all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base_sha, head_sha)) and base_sha != head_sha
          directory = Path('fixture-receipts')
          directory.mkdir(exist_ok=True)

          def save(name, value):
              (directory / name).write_text(json.dumps(value, indent=2) + '\n')

          def api(repository, path, method='GET', body=None):
              assert repository in identities and (method == 'GET' or (method == 'POST' and repository == repo and path == 'pulls'))
              args = ['gh', 'api', '--method', method, f'repos/{repository}/{path}', '-H', 'X-GitHub-Api-Version: 2022-11-28']
              if body is not None:
                  args += ['--input', '-']
              result = subprocess.run(args, input=None if body is None else json.dumps(body),
                  capture_output=True, text=True, timeout=30)
              if result.returncode:
                  raise RuntimeError(f'Fixture request failed: {method} {path}; inspect before retrying')
              assert len(result.stdout) < 2_000_000
              return json.loads(result.stdout)

          repository, fork = api(repo, ''), api(fork_repo, '')
          assert repository['id'] == identities[repo] and repository['full_name'] == repo and repository['private'] is False
          assert fork['id'] == identities[fork_repo] and fork['full_name'] == fork_repo and fork['fork'] is True and fork['private'] is False
          assert all(fork[key]['id'] == identities[base_repo] and fork[key]['full_name'] == base_repo for key in ('parent', 'source'))
          assert api(repo, f'git/ref/heads/{base}')['object']['sha'] == base_sha
          assert api(fork_repo, f'git/ref/heads/{head}')['object']['sha'] == head_sha
          commit = api(fork_repo, f'commits/{head_sha}')
          assert commit['sha'] == head_sha and commit['commit']['verification']['verified'] is True
          assert [parent['sha'] for parent in commit['parents']] == [base_sha]
          comparison = api(fork_repo, f'compare/{base_sha}...{head_sha}')
          assert comparison['status'] == 'ahead' and comparison['behind_by'] == 0 and comparison['ahead_by'] == comparison['total_commits'] == 1
          assert comparison['base_commit']['sha'] == comparison['merge_base_commit']['sha'] == base_sha
          files = comparison['files']
          assert 1 <= len(files) <= 8 and all(file['status'] == 'added' and
              re.fullmatch(r'[.]pr51-fork/[a-z-]+[.]txt', file['filename']) for file in files)
          existing = api(repo, 'pulls?' + urlencode({'state': 'open', 'head': 'birki-sandbox:' + head, 'base': base, 'per_page': 100}))
          assert isinstance(existing, list) and not existing, 'An existing PR needs root reconciliation, not another setup run'
          assert api(repo, f'git/ref/heads/{base}')['object']['sha'] == base_sha
          assert api(fork_repo, f'git/ref/heads/{head}')['object']['sha'] == head_sha
          body = {'head': 'birki-sandbox:' + head if repo == base_repo else head, 'base': base,
              'title': 'Fork acceptance: ' + kind,
              'body': 'Disposable marker-only fixture for exact-SHA branch-deploy acceptance.'}
          save('setup-request.json', {'repository': repo, 'repository_id': identities[repo], 'fixture': kind,
              'head_repository': fork_repo, 'head_repository_id': identities[fork_repo], 'base_sha': base_sha,
              'head_sha': head_sha, 'body': body, 'workflow_sha': os.environ['WORKFLOW_SHA'],
              'workflow_ref': os.environ['WORKFLOW_REF'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'comparison': comparison,
              'commit_verification': {'sha': head_sha, 'verified': True, 'reason': commit['commit']['verification']['reason']}})
          pull = api(repo, 'pulls', 'POST', body)
          stack = pull.get('stack')
          created = {key: pull.get(key) for key in ('id', 'number', 'state', 'draft', 'html_url')}
          created['user'] = {key: pull.get('user', {}).get(key) for key in ('login', 'id')}
          created['stack'] = None if stack is None else {
              **{key: stack.get(key) for key in ('id', 'number', 'position', 'size')},
              'base': {key: stack.get('base', {}).get(key) for key in ('ref', 'sha')}}
          for side in ('head', 'base'):
              value = pull.get(side, {})
              created[side] = {**{key: value.get(key) for key in ('ref', 'sha')},
                  'repo': {key: (value.get('repo') or {}).get(key) for key in ('id', 'full_name', 'fork', 'private')}}
          save('created-pr.json', created)
          assert pull['state'] == 'open' and pull['draft'] is False and pull.get('stack') is None
          assert pull['user']['login'] == 'github-actions[bot]' and pull['user']['id'] == 41898282
          assert pull['head']['sha'] == head_sha and pull['head']['ref'] == head and pull['base']['sha'] == base_sha and pull['base']['ref'] == base
          assert pull['head']['repo']['full_name'] == fork_repo and pull['head']['repo']['id'] == identities[fork_repo] and pull['head']['repo']['fork'] is True
          assert pull['base']['repo']['full_name'] == repo and pull['base']['repo']['id'] == identities[repo]
          records = [{'repository': repo, 'repository_id': identities[repo], 'number': pull['number'],
              'head_repository': fork_repo, 'head_repository_id': identities[fork_repo], 'head': head,
              'sha': head_sha, 'base': base, 'base_sha': base_sha, 'url': pull['html_url'], 'fixture': kind}]
          save('fixture-prs.json', records)
          print(json.dumps(records))
          PY
      - name: Preserve fixture creation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr51-fork-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixture-receipts/
          if-no-files-found: error
          retention-days: 7

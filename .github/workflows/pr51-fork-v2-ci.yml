name: pr51-fork-v2-ci
run-name: pr51-fork-v2 ${{ github.event_name }} ${{ github.event.pull_request.number || inputs.fixture }}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [pr51-fork-v2-trunk, pr51-fork-v2-join-a]
  workflow_dispatch:
    inputs:
      fixture:
        description: Approve one reviewed disposable fixture PR
        type: choice
        required: true
        options: [same, cross, join-a, join-b]
      base_sha:
        description: Exact reviewed base commit
        type: string
        required: true
      head_sha:
        description: Exact reviewed signed marker commit
        type: string
        required: true
      pull_number:
        description: Exact reviewed fixture PR number
        type: string
        required: true

permissions: {}

env:
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  WORKFLOW_REF: ${{ github.workflow_ref }}

jobs:
  pr51-fork-v2-ci:
    if: ${{ github.event_name == 'pull_request' && (github.repository == 'GrantBirki/actions-sandbox' || github.repository == 'birki-sandbox/actions-sandbox') && github.event.pull_request.head.repo.full_name == 'birki-sandbox/actions-sandbox' && startsWith(github.event.pull_request.head.ref, 'pr51-fork-v2-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check the signed marker commit without executing PR code
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          base_repo, fork_repo = 'GrantBirki/actions-sandbox', 'birki-sandbox/actions-sandbox'
          identities = {base_repo: 541028848, fork_repo: 1344307397}
          repo, head_sha = os.environ['GITHUB_REPOSITORY'], os.environ['EVENT_HEAD_SHA']
          number = int(os.environ['PR_NUMBER'])
          assert repo in identities and number > 0 and re.fullmatch(r'[0-9a-f]{40}', head_sha)

          def api(repository, path):
              assert repository in identities
              route = f'repos/{repository}' + (f'/{path}' if path else '')
              result = subprocess.run(['gh', 'api', '--method', 'GET', route,
                  '-H', 'X-GitHub-Api-Version: 2022-11-28'], capture_output=True, text=True, timeout=30)
              if result.returncode:
                  raise RuntimeError('Fixture metadata could not be read')
              assert len(result.stdout) < 2_000_000
              return json.loads(result.stdout)

          repository, fork = api(repo, ''), api(fork_repo, '')
          assert repository['id'] == identities[repo] and repository['full_name'] == repo and repository['private'] is False
          assert fork['id'] == identities[fork_repo] and fork['full_name'] == fork_repo and fork['fork'] is True and fork['private'] is False
          assert all(fork[key]['id'] == identities[base_repo] and fork[key]['full_name'] == base_repo for key in ('parent', 'source'))
          pull = api(repo, f'pulls/{number}')
          head, base = pull['head'], pull['base']
          assert pull['number'] == number and pull['state'] == 'open' and pull['merged'] is False and pull['draft'] is False
          assert pull['user']['login'] == 'GrantBirki' and pull['user']['id'] == 23362539 and pull['user']['type'] == 'User'
          assert head['repo']['id'] == identities[fork_repo] and head['repo']['full_name'] == fork_repo and head['repo']['fork'] is True
          assert base['repo']['id'] == identities[repo] and base['repo']['full_name'] == repo and head['sha'] == head_sha
          allowed = {'pr51-fork-v2-cross': 'pr51-fork-v2-trunk'} if repo == base_repo else {
              'pr51-fork-v2-same': 'pr51-fork-v2-trunk', 'pr51-fork-v2-join-a': 'pr51-fork-v2-trunk', 'pr51-fork-v2-join-b': 'pr51-fork-v2-join-a'}
          assert head['ref'] in allowed and base['ref'] == allowed[head['ref']]
          commit = api(fork_repo, f'commits/{head_sha}')
          assert commit['sha'] == head_sha and commit['commit']['verification']['verified'] is True
          files = api(repo, f'pulls/{number}/files?per_page=100')
          assert isinstance(files, list) and 1 <= len(files) == pull['changed_files'] <= 8
          assert all(file['status'] in ('added', 'modified') and not file.get('previous_filename') and
              re.fullmatch(r'[.]pr51-fork-v2/[a-z-]+[.]txt', file['filename']) for file in files)
          tree_sha = commit['commit']['tree']['sha']
          tree = api(fork_repo, f'git/trees/{tree_sha}?recursive=1')
          assert tree['sha'] == tree_sha and tree['truncated'] is False
          assert all(any(item['path'] == file['filename'] and item['sha'] == file['sha'] and
              item['type'] == 'blob' and item['mode'] == '100644' for item in tree['tree']) for file in files)
          current = api(repo, f'pulls/{number}')
          assert current['head']['sha'] == head_sha and current['base']['sha'] == base['sha']
          receipt = {'repository': repo, 'repository_id': identities[repo], 'pull': number,
              'head_repository': fork_repo, 'head_repository_id': identities[fork_repo],
              'base_ref': base['ref'], 'base_sha': base['sha'], 'head_ref': head['ref'], 'head_sha': head_sha,
              'commit_verified': True, 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'], 'workflow_sha': os.environ['WORKFLOW_SHA'],
              'workflow_ref': os.environ['WORKFLOW_REF'],
              'marker_files': [{key: file[key] for key in ('filename', 'status', 'sha')} for file in files]}
          assert receipt['event'] == 'pull_request'
          Path('ci.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Preserve genuine PR CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr51-fork-v2-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci.json
          if-no-files-found: error
          retention-days: 7

  approve-fixture:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.repository == 'GrantBirki/actions-sandbox' || github.repository == 'birki-sandbox/actions-sandbox') && github.actor == 'GrantBirki' && github.triggering_actor == 'GrantBirki' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: pr51-fork-v2-review-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      FIXTURE: ${{ inputs.fixture }}
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
      PULL_NUMBER: ${{ inputs.pull_number }}
    steps:
      - name: Approve only the exact signed marker fixture after genuine PR CI
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os, re, subprocess
          from pathlib import Path

          base_repo, fork_repo = 'GrantBirki/actions-sandbox', 'birki-sandbox/actions-sandbox'
          identities = {base_repo: 541028848, fork_repo: 1344307397}
          fixtures = {
              'same': (fork_repo, 'pr51-fork-v2-same', 'pr51-fork-v2-trunk'),
              'cross': (base_repo, 'pr51-fork-v2-cross', 'pr51-fork-v2-trunk'),
              'join-a': (fork_repo, 'pr51-fork-v2-join-a', 'pr51-fork-v2-trunk'),
              'join-b': (fork_repo, 'pr51-fork-v2-join-b', 'pr51-fork-v2-join-a'),
          }
          kind = os.environ['FIXTURE']
          assert kind in fixtures
          repo, head, base = fixtures[kind]
          assert repo == os.environ['GITHUB_REPOSITORY']
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_ACTOR'] == os.environ['GITHUB_TRIGGERING_ACTOR'] == 'GrantBirki'
          assert os.environ['GITHUB_ACTOR_ID'] == '23362539' and os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['WORKFLOW_REF'] == repo + '/.github/workflows/pr51-fork-v2-ci.yml@refs/heads/main'
          base_sha, head_sha, main_sha = os.environ['BASE_SHA'], os.environ['HEAD_SHA'], os.environ['WORKFLOW_SHA']
          assert all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base_sha, head_sha, main_sha)) and base_sha != head_sha
          assert re.fullmatch(r'[1-9][0-9]*', os.environ['PULL_NUMBER']) and re.fullmatch(r'[1-9][0-9]*', os.environ['GITHUB_RUN_ID'])
          number, run_id = int(os.environ['PULL_NUMBER']), int(os.environ['GITHUB_RUN_ID'])
          directory = Path('fixture-review-receipts')
          directory.mkdir(exist_ok=True)

          def save(name, value):
              (directory / name).write_text(json.dumps(value, indent=2) + '\n')

          def safe_text(value):
              if not isinstance(value, str):
                  return None
              token = os.environ.get('GH_TOKEN', '')
              if token:
                  value = value.replace(token, '[redacted]')
              value = re.sub(r'gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+', '[redacted]', value)
              return re.sub(r'[\x00-\x1f\x7f]', ' ', value)[:1000]

          def failure(result):
              status = re.search(r'HTTP\s+(\d{3})', result.stderr + result.stdout)
              try:
                  parsed = json.loads(result.stdout) if len(result.stdout) < 2_000_000 else {}
              except json.JSONDecodeError:
                  parsed = {}
              if not isinstance(parsed, dict):
                  parsed = {}
              status_value = parsed.get('status')
              if type(status_value) is int:
                  status_value = str(status_value)
              fallback = int(status_value) if isinstance(status_value, str) and re.fullmatch(r'[1-5][0-9]{2}', status_value) else None
              errors = []
              for item in parsed.get('errors', [])[:16] if isinstance(parsed.get('errors'), list) else []:
                  if isinstance(item, dict):
                      errors.append({key: safe_text(item[key]) for key in ('resource', 'field', 'code', 'message') if key in item})
                  elif isinstance(item, str):
                      errors.append(safe_text(item))
              if isinstance(parsed.get('errors'), str):
                  errors = safe_text(parsed['errors'])
              save('request-failure.json', {'status': int(status[1]) if status else fallback,
                  'message': safe_text(parsed.get('message')) or 'GitHub request failed', 'errors': errors})

          def api(repository, path, method='GET', body=None):
              assert repository in identities and (method == 'GET' or (
                  method == 'POST' and repository == repo and path == f'pulls/{number}/reviews'))
              route = f'repos/{repository}' + (f'/{path}' if path else '')
              args = ['gh', 'api', '--method', method, route, '-H', 'X-GitHub-Api-Version: 2022-11-28']
              if body is not None:
                  args += ['--input', '-']
              try:
                  result = subprocess.run(args, input=None if body is None else json.dumps(body),
                      capture_output=True, text=True, timeout=30)
              except subprocess.TimeoutExpired:
                  save('request-failure.json', {'status': None, 'message': 'GitHub request timed out', 'errors': []})
                  raise RuntimeError('Fixture request outcome needs inspection; do not retry') from None
              if result.returncode:
                  failure(result)
                  raise RuntimeError('Fixture request outcome needs inspection; do not retry')
              assert len(result.stdout) < 2_000_000
              return json.loads(result.stdout)

          def checked_pull():
              pull = api(repo, f'pulls/{number}')
              assert pull['number'] == number and pull['state'] == 'open' and pull['draft'] is False and pull['merged'] is False and pull.get('stack') is None
              assert pull['user']['login'] == 'GrantBirki' and pull['user']['id'] == 23362539 and pull['user']['type'] == 'User'
              for side, name, sha, repository in (('head', head, head_sha, fork_repo), ('base', base, base_sha, repo)):
                  value = pull[side]
                  assert value['ref'] == name and value['sha'] == sha and value['repo']['id'] == identities[repository]
                  assert value['repo']['full_name'] == repository and value['repo']['private'] is False and value['repo']['fork'] == (repository == fork_repo)
              assert api(repo, f'git/ref/heads/{base}')['object']['sha'] == base_sha
              assert api(fork_repo, f'git/ref/heads/{head}')['object']['sha'] == head_sha
              assert api(repo, 'git/ref/heads/main')['object']['sha'] == main_sha
              return pull

          repository, fork = api(repo, ''), api(fork_repo, '')
          assert repository['id'] == identities[repo] and repository['full_name'] == repo and repository['private'] is False and repository['fork'] == (repo == fork_repo)
          assert fork['id'] == identities[fork_repo] and fork['full_name'] == fork_repo and fork['fork'] is True and fork['private'] is False
          assert all(fork[key]['id'] == identities[base_repo] and fork[key]['full_name'] == base_repo for key in ('parent', 'source'))
          pull = checked_pull()
          commit = api(fork_repo, f'commits/{head_sha}')
          assert commit['sha'] == head_sha and commit['commit']['verification']['verified'] is True
          assert [parent['sha'] for parent in commit['parents']] == [base_sha]
          comparison = api(fork_repo, f'compare/{base_sha}...{head_sha}')
          assert comparison['status'] == 'ahead' and comparison['behind_by'] == 0 and comparison['ahead_by'] == comparison['total_commits'] == 1
          assert comparison['base_commit']['sha'] == comparison['merge_base_commit']['sha'] == base_sha
          files = api(repo, f'pulls/{number}/files?per_page=100')
          assert len(files) == pull['changed_files'] == len(comparison['files']) == 1
          marker = '.pr51-fork-v2/' + kind + '.txt'
          file, compared = files[0], comparison['files'][0]
          assert all(value['filename'] == marker and value['status'] == 'added' and not value.get('previous_filename') for value in (file, compared))
          assert file['sha'] == compared['sha'] and re.fullmatch(r'[0-9a-f]{40}', file['sha'])
          tree_sha = commit['commit']['tree']['sha']
          tree = api(fork_repo, f'git/trees/{tree_sha}?recursive=1')
          assert tree['sha'] == tree_sha and tree['truncated'] is False
          assert any(item['path'] == marker and item['sha'] == file['sha'] and item['type'] == 'blob' and item['mode'] == '100644' for item in tree['tree'])
          inventory = api(repo, f'commits/{head_sha}/check-runs?filter=all&per_page=100')
          assert inventory['total_count'] == len(inventory['check_runs']) < 100
          matching = [row for row in inventory['check_runs'] if row['name'] == 'pr51-fork-v2-ci' and row['app']['id'] == 15368]
          assert matching, 'Real PR CI must finish before approval'
          check = max(matching, key=lambda row: row['id'])
          assert check['head_sha'] == head_sha and check['status'] == 'completed' and check['conclusion'] == 'success'
          producer = re.fullmatch(r'https://github[.]com/' + re.escape(repo) + r'/actions/runs/([1-9][0-9]*)/job/([1-9][0-9]*)', check['details_url'])
          assert producer
          ci_run_id, ci_job_id = int(producer[1]), int(producer[2])
          ci_run = api(repo, f'actions/runs/{ci_run_id}')
          assert ci_run['id'] == ci_run_id and ci_run['event'] == 'pull_request' and ci_run['head_sha'] == head_sha
          assert ci_run['repository']['id'] == identities[repo] and ci_run['repository']['full_name'] == repo
          assert ci_run['path'].split('@')[0] == '.github/workflows/pr51-fork-v2-ci.yml'
          assert ci_run['status'] == 'completed' and ci_run['conclusion'] == 'success' and ci_run['check_suite_id'] == check['check_suite']['id']
          assert type(ci_run['run_attempt']) is int and ci_run['run_attempt'] > 0
          jobs = api(repo, f'actions/runs/{ci_run_id}/attempts/{ci_run["run_attempt"]}/jobs?per_page=100')
          assert jobs['total_count'] == len(jobs['jobs']) < 100
          matches = [job for job in jobs['jobs'] if job['id'] == ci_job_id and job['name'] == 'pr51-fork-v2-ci']
          assert len(matches) == 1
          job = matches[0]
          assert job['run_id'] == ci_run_id and job['head_sha'] == head_sha and job['status'] == 'completed' and job['conclusion'] == 'success'
          assert job['check_run_url'] == f'https://api.github.com/repos/{repo}/check-runs/{check["id"]}'
          reviews = api(repo, f'pulls/{number}/reviews?per_page=100')
          assert isinstance(reviews, list) and len(reviews) < 100
          assert not any(row['user']['login'] == 'github-actions[bot]' or row['user']['id'] == 41898282 for row in reviews), 'An existing bot review needs root reconciliation, not another approval run'
          checked_pull()
          text = 'Approve the exact signed marker fixture for acceptance testing.\n\nWorkflow: ' + f'https://github.com/{repo}/actions/runs/{run_id}'
          body = {'commit_id': head_sha, 'event': 'APPROVE', 'body': text}
          context = {'repository': repo, 'repository_id': identities[repo], 'fixture': kind, 'pull': number,
              'head_repository': fork_repo, 'head_repository_id': identities[fork_repo], 'head_ref': head, 'base_ref': base,
              'head_sha': head_sha, 'base_sha': base_sha, 'workflow_sha': main_sha, 'workflow_ref': os.environ['WORKFLOW_REF'],
              'run_id': str(run_id), 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          ci = {'check_id': check['id'], 'check_suite_id': check['check_suite']['id'], 'app_id': check['app']['id'],
              'run_id': ci_run_id, 'run_attempt': ci_run['run_attempt'], 'job_id': ci_job_id, 'head_sha': head_sha,
              'event': ci_run['event'], 'conclusion': ci_run['conclusion'], 'completed_at': check['completed_at']}
          save('approval-request.json', {**context, 'body': body, 'ci': ci,
              'commit_verification': {'sha': head_sha, 'verified': True},
              'marker': {key: file[key] for key in ('filename', 'status', 'sha')}, 'started_at': datetime.now(timezone.utc).isoformat()})
          created = api(repo, f'pulls/{number}/reviews', 'POST', body)
          review = {key: created.get(key) for key in ('id', 'node_id', 'state', 'commit_id', 'submitted_at', 'html_url', 'pull_request_url', 'body')}
          review['user'] = {key: created.get('user', {}).get(key) for key in ('login', 'id', 'type')}
          save('created-review.json', {**context, 'review': review, 'observed_at': datetime.now(timezone.utc).isoformat()})
          assert type(review['id']) is int and review['id'] > 0 and isinstance(review['node_id'], str)
          assert review['state'] == 'APPROVED' and review['commit_id'] == head_sha and review['body'] == text
          assert review['user'] == {'login': 'github-actions[bot]', 'id': 41898282, 'type': 'Bot'}
          assert review['pull_request_url'] == f'https://api.github.com/repos/{repo}/pulls/{number}'
          assert review['html_url'] == f'https://github.com/{repo}/pull/{number}#pullrequestreview-{review["id"]}'
          checked_pull()
          current = api(repo, f'pulls/{number}/reviews/{review["id"]}')
          assert all(current[key] == value for key, value in review.items() if key != 'user')
          assert {key: current['user'][key] for key in ('login', 'id', 'type')} == review['user']
          save('verified-review.json', {**context, 'review': review, 'verified_at': datetime.now(timezone.utc).isoformat()})
          print(json.dumps({'repository': repo, 'pull': number, 'head_sha': head_sha, 'review_id': review['id'], 'state': review['state']}))
          PY
      - name: Preserve fixture review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr51-fork-v2-reviews-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixture-review-receipts/
          if-no-files-found: error
          retention-days: 7
